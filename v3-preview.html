<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹅巷食光 · 完整料理版本预览</title><style>*{box-sizing:border-box}body{margin:0;background:#efe9dc;color:#604f38;font:14px/1.7 system-ui,sans-serif}main{max-width:1160px;margin:22px auto;padding:0 20px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:22px;margin:0}p{margin:4px 0 14px;color:#8a795e}select,button,a{font:inherit;color:#5d6b41;background:#fff9ea;border:1px solid #cbb996;padding:8px 12px;border-radius:10px;text-decoration:none}select{margin-right:8px}iframe{display:block;border:0;box-shadow:0 16px 50px #604a3225;border-radius:20px;max-width:100%;background:#fff4db}.screen{overflow:auto;padding-bottom:24px}small{color:#a18c69}</style></head><body><main><header><h1>鹅巷食光 · V4美术与料理图鉴</h1><a href="./">正式经营入口</a></header><p>139种成品 · 123道配方 · 26类三级设备 · V4单链器材 · 两个主页面</p><label>主题 <select id="stage" aria-label="预览主题"><option value="1">果蔬开张</option><option value="2">家常烟火</option><option value="3" selected>晨间茶饮</option><option value="4">街角烘焙</option><option value="5">炭火夜市</option><option value="6">海港蒸鲜</option><option value="7">缤纷甜点</option><option value="8">晚风特调</option><option value="cooking">三材料料理样板</option><option value="complete">完整图鉴通关存档</option></select></label><label>尺寸 <select id="size" aria-label="预览尺寸"><option value="360,640">360 × 640</option><option value="390,844" selected>390 × 844</option><option value="430,900">430 × 900</option></select></label><button id="apply">切换预览</button> <button id="fit">缩放全览</button><p><small>每个主题使用领域命令游玩得到的存档。预览拥有独立存档，不影响正式经营进度。</small></p><pre id="layout-report" style="position:fixed;right:20px;top:160px;max-width:calc(100vw - 520px);max-height:70vh;overflow:auto;font-size:10px;white-space:pre-wrap" aria-label="布局验证报告"></pre><div class="screen"><iframe title="手机游戏预览" id="game" width="390" height="844" src="v3-play.html?stage=3&amp;size=390"></iframe></div></main><script>addEventListener('message',event=>{if(event.origin===location.origin&&event.source===document.getElementById('game').contentWindow&&event.data?.type==='v3-layout')document.getElementById('layout-report').textContent=JSON.stringify(event.data,null,2);});document.getElementById('fit').onclick=()=>{const f=document.getElementById('game');const scale=f.style.transform?'':'.6';f.style.transform=scale?'scale('+scale+')':'';f.style.transformOrigin='top left';document.querySelector('.screen').style.height=scale?Number(f.height)*.6+'px':'';};document.getElementById('apply').onclick=()=>{const [w,h]=document.getElementById('size').value.split(',');const frame=document.getElementById('game');frame.width=w;frame.height=h;frame.src='v3-play.html?stage='+document.getElementById('stage').value+'&size='+w;};</script></body></html>
