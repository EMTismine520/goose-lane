const prefix=location.pathname.endsWith('/art-v4.html')?'./':location.protocol==='file:'?'../../public/':'../../';
let blind=false;
function render(){
 const query=document.querySelector('#q').value.toLowerCase(),kind=document.querySelector('#kind').value,level=document.querySelector('#level').value;
 document.documentElement.style.setProperty('--size',document.querySelector('#size').value+'px');
 document.body.className=document.querySelector('#mode').value+(blind?' blind':'');
 const rows=data.filter(x=>(!kind||x.kind===kind)&&(!level||String(x.level)===level)&&(!query||(x.name+' '+x.id).toLowerCase().includes(query)));
 document.querySelector('#count').textContent=rows.length+' / '+data.length+' 项 · V4';
 document.querySelector('#grid').replaceChildren(...rows.map((x,index)=>{
  const card=document.createElement('article'),art=document.createElement('div'),image=document.createElement('img'),name=document.createElement('span'),id=document.createElement('small'),tag=document.createElement('span');
  art.className='art';image.src=prefix+x.path;image.alt=x.name+(x.kind==='device'?' '+x.level+'级':'');image.loading='lazy';image.width=96;image.height=96;
  name.className='name';name.textContent=x.name+(x.kind==='device'?' · '+x.level+'级':'');
  id.className='id';id.textContent=x.id;tag.className='tag';tag.textContent=blind?'#'+(index+1):({device:'器材成长',material:'合成食材',recipe:'料理饮品'}[x.kind]);
  art.append(image);card.append(art,name,id,tag);return card;
 }));
}
document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));
document.querySelector('#blind').addEventListener('click',()=>{blind=!blind;document.querySelector('#blind').setAttribute('aria-pressed',String(blind));document.querySelector('#blind').textContent=blind?'显示名称':'隐藏名称';render();});
render();
</script>
